      - name: "Fichier app/src/main/res/xml/accessibility_service.xml"
        run: |
          mkdir -p "FlowShare/app/src/main/res/xml"
          cat > "FlowShare/app/src/main/res/xml/accessibility_service.xml" <<'FLOWSHARE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeWindowsChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/a11y_description"
              android:notificationTimeout="150"
              android:settingsActivity="com.flowshare.app.SetupActivity" />
          FLOWSHARE_EOF

      - name: "Fichier app/src/main/res/xml/apduservice.xml"
        run: |
          mkdir -p "FlowShare/app/src/main/res/xml"
          cat > "FlowShare/app/src/main/res/xml/apduservice.xml" <<'FLOWSHARE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <host-apdu-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/hce_description"
              android:requireDeviceUnlock="false">
              <!-- AID standard d'une puce NFC "Type 4" contenant un message NDEF -->
              <aid-group
                  android:category="other"
                  android:description="@string/hce_description">
                  <aid-filter android:name="D2760000850101" />
              </aid-group>
          </host-apdu-service>
          FLOWSHARE_EOF

      - name: "Fichier build.gradle.kts"
        run: |
          mkdir -p "FlowShare/."
          cat > "FlowShare/build.gradle.kts" <<'FLOWSHARE_EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          FLOWSHARE_EOF

      - name: "Fichier gradle.properties"
        run: |
          mkdir -p "FlowShare/."
          cat > "FlowShare/gradle.properties" <<'FLOWSHARE_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          FLOWSHARE_EOF

      - name: "Fichier settings.gradle.kts"
        run: |
          mkdir -p "FlowShare/."
          cat > "FlowShare/settings.gradle.kts" <<'FLOWSHARE_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FlowShare"
          include(":app")
          FLOWSHARE_EOF

      - name: Compiler
        working-directory: FlowShare
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FlowShare-apk
          path: FlowShare/app/build/outputs/apk/debug/app-debug.apk
