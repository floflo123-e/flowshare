              <string name="live_signal">Signal FlowShare capté : %1$d dBm\n(colle les téléphones et règle la barre juste au-dessus de cette valeur)</string>
              <string name="live_signal_none">Aucun signal capté. Pour tester : ouvre une photo sur l\'autre téléphone et rapproche-le.</string>
              <string name="auto_no_share">Bouton Partager introuvable dans la galerie</string>
