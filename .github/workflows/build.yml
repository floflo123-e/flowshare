              <string name="main_title">FlowShare</string>
              <string name="main_intro">Ouvre une photo (dans FlowShare ou dans la Galerie Samsung), colle ton téléphone contre un autre Android qui a FlowShare : la photo passe d\'un écran à l\'autre.</string>
              <string name="main_steps">1. Autorise l\'app (une seule fois, sur chaque téléphone)\n2. Active le NFC sur les deux téléphones\n3. Dans la Galerie : Partager → FlowShare (ou ouvre une photo ci-dessous)\n4. Colle les deux téléphones dos à dos, écrans allumés et déverrouillés</string>
              <string name="btn_permissions">Autoriser FlowShare</string>
              <string name="btn_nfc">Activer le NFC</string>
              <string name="btn_pick">Choisir une photo à envoyer</string>
              <string name="status_ready">✓ Prêt : les autorisations et le NFC sont OK</string>
              <string name="status_perm_missing">Autorisations manquantes (appareils à proximité)</string>
              <string name="status_nfc_off">Le NFC est désactivé</string>
              <string name="status_no_nfc">Ce téléphone n\'a pas de NFC : FlowShare ne pourra pas fonctionner</string>

              <string name="send_hint">Colle ton téléphone dos à dos contre un autre</string>
              <string name="send_touch">Téléphone détecté…</string>
              <string name="send_sending">Envoi…</string>
              <string name="send_done">Envoyé ✓</string>
              <string name="send_error">Échec de l\'envoi, réessaie</string>
              <string name="send_timeout">L\'autre téléphone n\'a pas répondu. A-t-il autorisé FlowShare ?</string>
              <string name="btn_change">Changer</string>

              <string name="recv_waiting">Réception…</string>
              <string name="recv_connected">Connecté</string>
              <string name="recv_done">Photo reçue ✓\nEnregistrée dans Galerie › FlowShare</string>
              <string name="recv_error">La réception a échoué</string>
              <string name="recv_timeout">Le téléphone qui envoie n\'a pas été trouvé</string>
              <string name="recv_perm">Ouvre FlowShare une fois et autorise les appareils à proximité pour pouvoir recevoir</string>
              <string name="btn_open">Ouvrir</string>
              <string name="btn_close">Fermer</string>
              <string name="btn_allow">Autoriser</string>
              <string name="nearby_error">Erreur de connexion : %1$s</string>
              <string name="settings">Réglages</string>
              <string name="banner_setup">⚠ Configuration incomplète : touche ici pour finir les réglages (Bluetooth, accessibilité…)</string>
              <string name="btn_photos">Autoriser l\'accès aux photos</string>
              <string name="btn_bluetooth">Activer le Bluetooth</string>
              <string name="btn_accessibility">Activer FlowShare dans Accessibilité</string>
              <string name="btn_restricted">Étape préalable : autoriser les paramètres restreints</string>
              <string name="check_perms">Appareils à proximité autorisés</string>
              <string name="check_nfc">NFC activé (dos à dos)</string>
              <string name="check_no_nfc">Pas de NFC : seul le Bluetooth sera utilisé</string>
              <string name="check_bt">Bluetooth activé (n\'importe quel sens)</string>
              <string name="check_a11y">Service d\'accessibilité FlowShare (Galerie Samsung + réception Bluetooth)</string>
              <string name="a11y_explain">Pourquoi l\'accessibilité ? Elle permet à FlowShare de voir quand une photo est ouverte dans la Galerie Samsung et d\'appuyer sur Partager à ta place, et d\'écouter le Bluetooth pour recevoir même app fermée. Android affiche un avertissement « contrôle total » : FlowShare ne lit que la Galerie et le menu Partager, rien n\'est envoyé sur internet.\n\nSi le bouton est grisé dans Accessibilité : Infos de l\'appli FlowShare › ⋮ (en haut à droite) › « Autoriser les paramètres restreints ».</string>
              <string name="a11y_description">Envoie la photo ouverte dans ta galerie quand tu colles ton téléphone contre un autre, et reçoit les photos par Bluetooth. FlowShare lit uniquement l\'écran de la galerie et le menu Partager.</string>
