          import android.nfc.NfcAdapter
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.Parcelable
          import android.view.View
          import android.view.animation.OvershootInterpolator
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.ProgressBar
          import android.widget.TextView
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import com.google.android.gms.nearby.Nearby
          import com.google.android.gms.nearby.connection.ConnectionInfo
          import com.google.android.gms.nearby.connection.ConnectionLifecycleCallback
          import com.google.android.gms.nearby.connection.ConnectionResolution
          import com.google.android.gms.nearby.connection.DiscoveredEndpointInfo
          import com.google.android.gms.nearby.connection.DiscoveryOptions
          import com.google.android.gms.nearby.connection.EndpointDiscoveryCallback
          import com.google.android.gms.nearby.connection.Payload
          import com.google.android.gms.nearby.connection.PayloadCallback
          import com.google.android.gms.nearby.connection.PayloadTransferUpdate
          import com.google.android.gms.nearby.connection.Strategy
          import org.json.JSONObject
          import java.util.concurrent.Executors

          /**
           * Ouvert automatiquement par Android quand on approche un téléphone qui envoie
           * (même si FlowShare était fermé). Retrouve l'expéditeur via Nearby, reçoit la photo,
           * l'enregistre dans la Galerie et la fait "couler" depuis le bord de l'écran.
           */
          class ReceiveActivity : ComponentActivity() {

              private lateinit var glow: GlowEdgeView
              private lateinit var card: FrameLayout
              private lateinit var image: ImageView
              private lateinit var status: TextView
              private lateinit var progress: ProgressBar
