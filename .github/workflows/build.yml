              private var expectedFileId: Long? = null
              private var savedUri: Uri? = null
              private var done = false
              private val files = HashMap<Long, Payload>()

              private val handler = Handler(Looper.getMainLooper())
              private val io = Executors.newSingleThreadExecutor()
              private val client by lazy { Nearby.getConnectionsClient(this) }
              private val timeout = Runnable { fail(getString(R.string.recv_timeout)) }

              private val askPermissions =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                      val t = token
                      if (Permissions.allGranted(this) && t != null) startDiscovery(t)
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_receive)
                  glow = findViewById(R.id.glow)
                  card = findViewById(R.id.card)
                  image = findViewById(R.id.image)
                  status = findViewById(R.id.status)
                  progress = findViewById(R.id.progress)
                  buttons = findViewById(R.id.buttons)
                  btnOpen = findViewById(R.id.btnOpen)
                  card.clipToOutline = true
                  findViewById<Button>(R.id.btnClose).setOnClickListener { finish() }
                  handle(intent)
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  handle(intent)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacksAndMessages(null)
                  try {
                      client.stopDiscovery()
                      client.stopAllEndpoints()
                  } catch (_: Exception) {
                  }
                  io.shutdown()
              }

              private fun handle(intent: Intent?) {
                  val t = parseToken(intent) ?: run { if (token == null) finish(); return }
                  if (t == token) return
                  // Nouvelle réception : on repart de zéro.
                  try {
                      client.stopDiscovery()
                      client.stopAllEndpoints()
                  } catch (_: Exception) {
                  }
                  token = t
                  meta = null
                  expectedFileId = null
                  savedUri = null
                  done = false
                  files.clear()
                  card.visibility = View.INVISIBLE
                  buttons.visibility = View.INVISIBLE
                  progress.visibility = View.VISIBLE
                  progress.isIndeterminate = true

                  glow.setIntensity(1f)
                  glow.startPulse()

                  if (Permissions.allGranted(this)) {
                      startDiscovery(t)
                  } else {
                      status.text = getString(R.string.recv_perm)
                      buttons.visibility = View.VISIBLE
                      btnOpen.visibility = View.VISIBLE
                      btnOpen.text = getString(R.string.btn_allow)
                      btnOpen.setOnClickListener { askPermissions.launch(Permissions.required()) }
                  }
              }

              private fun parseToken(intent: Intent?): String? {
                  // Ouvert par le Bluetooth (service d'accessibilité)
                  intent?.getStringExtra(ShareSession.EXTRA_TOKEN)?.let { return it }
                  // Ouvert par le NFC
                  if (intent?.action != NfcAdapter.ACTION_NDEF_DISCOVERED) return null
                  val raw: Array<out Parcelable>? =
                      if (Build.VERSION.SDK_INT >= 33)
                          intent.getParcelableArrayExtra(NfcAdapter.EXTRA_NDEF_MESSAGES, NdefMessage::class.java)
                      else @Suppress("DEPRECATION") intent.getParcelableArrayExtra(NfcAdapter.EXTRA_NDEF_MESSAGES)
                  raw?.forEach { msg ->
                      (msg as? NdefMessage)?.records?.forEach { rec ->
                          if (rec.tnf == NdefRecord.TNF_MIME_MEDIA &&
                              String(rec.type, Charsets.US_ASCII) == ShareSession.MIME_TOKEN
                          ) {
                              return String(rec.payload, Charsets.UTF_8)
                          }
                      }
                  }
                  return null
              }

              // ---------- Nearby ----------

              private fun startDiscovery(t: String) {
                  buttons.visibility = View.INVISIBLE
                  status.text = getString(R.string.recv_waiting)
                  handler.removeCallbacks(timeout)
                  handler.postDelayed(timeout, 20_000)
                  val options = DiscoveryOptions.Builder().setStrategy(Strategy.P2P_POINT_TO_POINT).build()
                  client.startDiscovery(ShareSession.SERVICE_ID, discoveryCallback, options)
                      .addOnFailureListener { e -> fail(getString(R.string.nearby_error, e.message ?: "?")) }
              }

              private val discoveryCallback = object : EndpointDiscoveryCallback() {
                  override fun onEndpointFound(id: String, info: DiscoveredEndpointInfo) {
                      val t = token ?: return
                      if (info.endpointName != ShareSession.senderName(t)) return
                      client.stopDiscovery()
                      client.requestConnection(ShareSession.receiverName(t), id, lifecycleCallback)
                          .addOnFailureListener { e -> fail(getString(R.string.nearby_error, e.message ?: "?")) }
                  }

                  override fun onEndpointLost(id: String) {}
              }

              private val lifecycleCallback = object : ConnectionLifecycleCallback() {
                  override fun onConnectionInitiated(id: String, info: ConnectionInfo) {
                      client.acceptConnection(id, payloadCallback)
                  }

                  override fun onConnectionResult(id: String, resolution: ConnectionResolution) {
                      if (resolution.status.isSuccess) status.text = getString(R.string.recv_connected)
                      else fail(getString(R.string.recv_error))
                  }

                  override fun onDisconnected(id: String) {
                      if (!done) fail(getString(R.string.recv_error))
                  }
              }

              private val payloadCallback = object : PayloadCallback() {
                  override fun onPayloadReceived(id: String, payload: Payload) {
                      when (payload.type) {
                          Payload.Type.BYTES -> {
                              val bytes = payload.asBytes() ?: return
                              try {
                                  val json = JSONObject(String(bytes, Charsets.UTF_8))
                                  meta = MediaUtils.Meta(
                                      json.optString("name", "photo_${System.currentTimeMillis()}.jpg"),
                                      json.optString("mime", "image/jpeg"),
                                      json.optLong("size", -1L)
                                  )
                                  expectedFileId = json.optLong("payloadId")
                              } catch (_: Exception) {
                              }
                          }
                          Payload.Type.FILE -> files[payload.id] = payload
                      }
                  }

                  override fun onPayloadTransferUpdate(id: String, update: PayloadTransferUpdate) {
                      val expected = expectedFileId
                      val isFile = files.containsKey(update.payloadId) || update.payloadId == expected
                      if (!isFile) return
                      when (update.status) {
                          PayloadTransferUpdate.Status.IN_PROGRESS -> {
                              if (update.totalBytes > 0) {
                                  progress.isIndeterminate = false
                                  progress.progress = (100 * update.bytesTransferred / update.totalBytes).toInt()
                              }
                          }
                          PayloadTransferUpdate.Status.SUCCESS -> {
                              val payload = files.remove(update.payloadId) ?: return
                              handler.removeCallbacks(timeout)
                              saveAndShow(id, payload)
                          }
                          PayloadTransferUpdate.Status.FAILURE,
                          PayloadTransferUpdate.Status.CANCELED -> fail(getString(R.string.recv_error))
                      }
                  }
              }

              private fun saveAndShow(endpointId: String, payload: Payload) {
                  done = true
                  val pfd = payload.asFile()?.asParcelFileDescriptor() ?: return fail(getString(R.string.recv_error))
                  val m = meta ?: MediaUtils.Meta("photo_${System.currentTimeMillis()}.jpg", "image/jpeg", -1L)
                  io.execute {
                      val uri = MediaUtils.saveToGallery(this, pfd, m)
                      val bitmap = uri?.let { MediaUtils.loadBitmap(this, it) }
                      runOnUiThread {
                          client.disconnectFromEndpoint(endpointId)
                          if (uri == null || bitmap == null) {
                              fail(getString(R.string.recv_error))
                          } else {
                              savedUri = uri
                              image.setImageBitmap(bitmap)
                              playArrival(uri, m.mime)
                          }
                      }
                  }
              }

              // ---------- Animation d'arrivée ----------

              private fun playArrival(uri: Uri, mime: String) {
                  progress.visibility = View.INVISIBLE
                  val drop = resources.displayMetrics.heightPixels * 0.6f
                  card.visibility = View.VISIBLE
                  card.translationY = -drop
                  card.scaleX = 0.7f
                  card.scaleY = 0.7f
                  card.alpha = 0f
                  card.animate()
                      .translationY(0f).scaleX(1f).scaleY(1f).alpha(1f)
                      .setInterpolator(OvershootInterpolator(0.8f))
                      .setDuration(700)
                      .start()

                  // Flou → net pendant l'arrivée (Android 12+)
                  if (Build.VERSION.SDK_INT >= 31) {
                      ValueAnimator.ofFloat(40f, 0.1f).apply {
                          duration = 700
                          addUpdateListener {
                              val r = it.animatedValue as Float
                              card.setRenderEffect(RenderEffect.createBlurEffect(r, r, Shader.TileMode.CLAMP))
                          }
                          doOnEndCompat { card.setRenderEffect(null) }
                          start()
                      }
                  }

                  glow.stopPulse()
                  glow.setIntensity(0.35f, 900)
                  status.text = getString(R.string.recv_done)
                  buttons.visibility = View.VISIBLE
                  btnOpen.visibility = View.VISIBLE
                  btnOpen.text = getString(R.string.btn_open)
                  btnOpen.setOnClickListener {
                      val view = Intent(Intent.ACTION_VIEW)
                          .setDataAndType(uri, mime)
                          .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      try {
                          startActivity(view)
                      } catch (_: Exception) {
                      }
                  }
              }

              private fun fail(message: String) {
                  handler.removeCallbacks(timeout)
                  try {
                      client.stopDiscovery()
                      client.stopAllEndpoints()
                  } catch (_: Exception) {
                  }
                  glow.stopPulse()
                  glow.setIntensity(0f)
                  progress.visibility = View.INVISIBLE
                  status.text = message
                  buttons.visibility = View.VISIBLE
                  btnOpen.visibility = View.GONE
              }

              private inline fun ValueAnimator.doOnEndCompat(crossinline action: () -> Unit) {
                  addListener(object : android.animation.AnimatorListenerAdapter() {
                      override fun onAnimationEnd(animation: android.animation.Animator) = action()
                  })
              }
          }
          FLOWSHARE_EOF

      - name: "Fichier app/src/main/java/com/flowshare/app/SendActivity.kt"
        run: |
          mkdir -p "FlowShare/app/src/main/java/com/flowshare/app"
          cat > "FlowShare/app/src/main/java/com/flowshare/app/SendActivity.kt" <<'FLOWSHARE_EOF'
          package com.flowshare.app

          import android.content.ContentUris
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import android.view.GestureDetector
          import android.view.MotionEvent
          import android.view.View
          import android.view.animation.AccelerateInterpolator
          import android.widget.Button
          import android.widget.ImageView
          import android.widget.ProgressBar
          import android.widget.TextView
          import androidx.activity.ComponentActivity
          import androidx.activity.result.PickVisualMediaRequest
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.lifecycle.Lifecycle
          import kotlin.math.abs

          /**
           * La visionneuse de photo. Trois façons d'arriver ici :
           *  - depuis la galerie FlowShare (swipe gauche/droite entre les photos),
           *  - via "Partager › FlowShare" ou "Ouvrir avec" depuis une autre app,
           *  - automatiquement depuis la Galerie Samsung, quand le service d'accessibilité
           *    a appuyé sur Partager à ta place : l'envoi part tout de suite (mode auto).
           *
           * Tant qu'elle est affichée, coller un autre téléphone envoie la photo.
           */
          class SendActivity : ComponentActivity(), SenderEngine.Listener {

              private lateinit var photo: ImageView
              private lateinit var scrim: View
              private lateinit var glow: GlowEdgeView
              private lateinit var status: TextView
              private lateinit var progress: ProgressBar
              private lateinit var btnChange: Button

              private var photoUri: Uri? = null
              private var auto = false
              private var galleryIndex = -1
              private var askedPermissions = false
              private val handler = Handler(Looper.getMainLooper())

              private val pickPhoto =
                  registerForActivityResult(ActivityResultContracts.PickVisualMedia()) { uri ->
                      if (uri != null) showPhoto(uri) else if (photoUri == null) finish()
                  }

              private val askPermissions =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                      if (Permissions.allGranted(this)) armIfPossible()
                      else status.text = getString(R.string.status_perm_missing)
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_send)
                  photo = findViewById(R.id.photo)
                  scrim = findViewById(R.id.scrim)
                  glow = findViewById(R.id.glow)
                  status = findViewById(R.id.status)
                  progress = findViewById(R.id.progress)
                  btnChange = findViewById(R.id.btnChange)
                  btnChange.setOnClickListener { launchPicker() }

                  val gestures = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onDown(e: MotionEvent): Boolean = true
                      override fun onFling(e1: MotionEvent?, e2: MotionEvent, vx: Float, vy: Float): Boolean {
                          if (abs(vx) > abs(vy) && abs(vx) > 600) {
                              step(if (vx < 0) 1 else -1)
                              return true
                          }
                          return false
                      }
                  })
                  photo.setOnTouchListener { _, ev -> gestures.onTouchEvent(ev) }

                  handleIntent(intent, allowPicker = savedInstanceState == null)
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  handleIntent(intent, allowPicker = false)
              }

              override fun onResume() {
                  super.onResume()
                  SenderEngine.addListener(this)
                  if (auto) {
                      render(SenderEngine.state, 0f, null)
                  } else {
                      NfcModes.enterSendMode(this)
                      armIfPossible()
                  }
              }

              override fun onPause() {
                  super.onPause()
                  SenderEngine.removeListener(this)
                  if (!auto) {
                      NfcModes.exitSendMode(this)
                      SenderEngine.disarm(SenderEngine.Source.IN_APP)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacksAndMessages(null)
              }

              // ---------- Entrées ----------

              private fun handleIntent(intent: Intent?, allowPicker: Boolean) {
                  val index = intent?.getIntExtra(EXTRA_GALLERY_INDEX, -1) ?: -1
                  if (index >= 0 && index < GalleryHolder.ids.size) {
                      auto = false
                      galleryIndex = index
                      btnChange.visibility = View.GONE
                      showPhoto(uriForId(GalleryHolder.ids[index]))
                      return
                  }

                  val uri = extractUri(intent)
                  if (uri != null) {
                      galleryIndex = -1
                      if (SenderEngine.awaitingGalleryUri) {
                          // Partage déclenché par le service d'accessibilité : on envoie directement.
                          auto = true
                          btnChange.visibility = View.GONE
                          showPhoto(uri)
                          SenderEngine.provideUri(uri)
                          render(SenderEngine.state, 0f, null)
                      } else {
                          auto = false
                          btnChange.visibility = View.VISIBLE
                          showPhoto(uri)
                      }
                      return
                  }
                  if (allowPicker) launchPicker()
              }

              private fun extractUri(intent: Intent?): Uri? = when (intent?.action) {
                  Intent.ACTION_SEND ->
                      if (Build.VERSION.SDK_INT >= 33) intent.getParcelableExtra(Intent.EXTRA_STREAM, Uri::class.java)
                      else @Suppress("DEPRECATION") intent.getParcelableExtra<Uri>(Intent.EXTRA_STREAM)
                  Intent.ACTION_VIEW -> intent.data
                  else -> null
              }

              private fun launchPicker() {
                  pickPhoto.launch(PickVisualMediaRequest(ActivityResultContracts.PickVisualMedia.ImageOnly))
              }

              private fun uriForId(id: Long): Uri =
                  ContentUris.withAppendedId(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, id)

              private fun showPhoto(uri: Uri) {
                  photoUri = uri
                  photo.setImageBitmap(MediaUtils.loadBitmap(this, uri))
                  resetVisuals()
                  if (!auto && lifecycle.currentState.isAtLeast(Lifecycle.State.RESUMED)) {
                      if (SenderEngine.state == SenderEngine.State.ARMED && SenderEngine.source == SenderEngine.Source.IN_APP) {
                          SenderEngine.provideUri(uri)
                      } else {
                          armIfPossible()
                      }
                  }
              }

              /** Swipe entre les photos de la galerie FlowShare. */
              private fun step(delta: Int) {
                  if (galleryIndex < 0 || SenderEngine.isBusy) return
                  val next = galleryIndex + delta
                  if (next < 0 || next >= GalleryHolder.ids.size) return
                  galleryIndex = next
                  val out = if (delta > 0) -photo.width.toFloat() else photo.width.toFloat()
                  photo.animate().translationX(out).alpha(0f).setDuration(120).withEndAction {
                      showPhoto(uriForId(GalleryHolder.ids[next]))
                      photo.translationX = -out
                      photo.animate().translationX(0f).alpha(1f).setDuration(160).start()
                  }.start()
              }

              private fun armIfPossible() {
                  val uri = photoUri ?: return
                  if (!Permissions.allGranted(this)) {
                      if (!askedPermissions) {
                          askedPermissions = true
                          askPermissions.launch(Permissions.required())
                      } else {
                          status.text = getString(R.string.status_perm_missing)
                      }
                      return
                  }
                  if (SenderEngine.state == SenderEngine.State.IDLE || SenderEngine.state == SenderEngine.State.ARMED) {
                      SenderEngine.arm(uri, SenderEngine.Source.IN_APP)
                  }
              }

              // ---------- Animations ----------

              override fun onEngineUpdate(state: SenderEngine.State, progress: Float, message: String?) {
                  render(state, progress, message)
              }

              private fun render(state: SenderEngine.State, fraction: Float, message: String?) {
                  when (state) {
                      SenderEngine.State.IDLE -> {
                          if (!auto) {
                              resetVisuals()
                              if (lifecycle.currentState.isAtLeast(Lifecycle.State.RESUMED)) armIfPossible()
                          }
                      }
                      SenderEngine.State.ARMED -> if (!auto) resetVisuals()
                      SenderEngine.State.CONNECTING -> touchedVisuals(indeterminate = true)
                      SenderEngine.State.SENDING -> {
                          touchedVisuals(indeterminate = false)
                          progress.progress = (fraction * 100).toInt()
                          // La photo glisse vers le bord en contact pendant le transfert.
                          photo.translationY = -fraction * photo.height * 0.5f
                          photo.alpha = 1f - 0.5f * fraction
                          status.text = getString(R.string.send_sending)
                      }
                      SenderEngine.State.DONE -> {
                          sentVisuals()
                          if (auto) handler.postDelayed({ finish() }, 1400)
                      }
                      SenderEngine.State.FAILED -> {
                          resetVisuals()
                          status.text = message ?: getString(R.string.send_error)
                          if (auto) handler.postDelayed({ finish() }, 2200)
                      }
                  }
              }

              private fun touchedVisuals(indeterminate: Boolean) {
                  if (scrim.alpha < 0.5f) {
                      scrim.animate().alpha(0.55f).setDuration(400).start()
                      photo.animate().scaleX(0.86f).scaleY(0.86f).setDuration(400).start()
                      glow.setIntensity(1f)
                      glow.startPulse()
                  }
                  status.text = getString(R.string.send_touch)
                  progress.visibility = View.VISIBLE
                  progress.isIndeterminate = indeterminate
              }

              private fun sentVisuals() {
                  status.text = getString(R.string.send_done)
                  progress.isIndeterminate = false
                  progress.progress = 100
                  photo.animate()
                      .translationY(-photo.height * 1.2f)
                      .alpha(0f)
                      .setInterpolator(AccelerateInterpolator())
                      .setDuration(350)
                      .start()
                  glow.stopPulse()
                  glow.setIntensity(0f, 900)
              }

              private fun resetVisuals() {
                  photo.animate().cancel()
                  photo.translationY = 0f
                  photo.translationX = 0f
                  photo.alpha = 1f
                  photo.scaleX = 1f
                  photo.scaleY = 1f
                  scrim.animate().alpha(0f).setDuration(250).start()
                  glow.stopPulse()
                  glow.setIntensity(0f, 250)
                  progress.visibility = View.INVISIBLE
                  progress.progress = 0
                  status.text = getString(R.string.send_hint)
              }

              companion object {
                  const val EXTRA_GALLERY_INDEX = "com.flowshare.app.GALLERY_INDEX"
              }
          }

          /** Liste des photos de la galerie FlowShare, partagée avec la visionneuse. */
          object GalleryHolder {
              var ids: LongArray = LongArray(0)
          }
          FLOWSHARE_EOF

      - name: "Fichier app/src/main/java/com/flowshare/app/SenderEngine.kt"
        run: |
          mkdir -p "FlowShare/app/src/main/java/com/flowshare/app"
          cat > "FlowShare/app/src/main/java/com/flowshare/app/SenderEngine.kt" <<'FLOWSHARE_EOF'
          package com.flowshare.app

          import android.content.Context
          import android.net.Uri
          import android.os.Handler
          import android.os.Looper
          import com.google.android.gms.nearby.Nearby
          import com.google.android.gms.nearby.connection.AdvertisingOptions
          import com.google.android.gms.nearby.connection.ConnectionInfo
          import com.google.android.gms.nearby.connection.ConnectionLifecycleCallback
          import com.google.android.gms.nearby.connection.ConnectionResolution
          import com.google.android.gms.nearby.connection.Payload
          import com.google.android.gms.nearby.connection.PayloadCallback
          import com.google.android.gms.nearby.connection.PayloadTransferUpdate
          import com.google.android.gms.nearby.connection.Strategy
          import org.json.JSONObject
          import java.util.concurrent.CopyOnWriteArraySet

          /**
           * Le moteur d'envoi, indépendant des écrans : il peut tourner pendant que tu es dans la
           * Galerie Samsung (porté par le service d'accessibilité) ou dans la galerie FlowShare.
           *
           * Cycle : IDLE → ARMED (photo prête, NFC + Bluetooth actifs) → CONNECTING (téléphone collé)
           *         → SENDING → DONE → IDLE.
           */
          object SenderEngine {

              enum class State { IDLE, ARMED, CONNECTING, SENDING, DONE, FAILED }
              enum class Source { IN_APP, GALLERY }

              fun interface Listener {
                  fun onEngineUpdate(state: State, progress: Float, message: String?)
              }

              private lateinit var app: Context
              private val main = Handler(Looper.getMainLooper())
              private val listeners = CopyOnWriteArraySet<Listener>()

              var state = State.IDLE
                  private set
              var source: Source? = null
                  private set

              private var token: String? = null
              private var uri: Uri? = null
              private var endpointId: String? = null
              private var filePayloadId: Long? = null

              /** Branché par le service d'accessibilité : appuie sur Partager › FlowShare dans la Galerie. */
              var shareTrigger: (() -> Unit)? = null

              private val client by lazy { Nearby.getConnectionsClient(app) }
              private val timeout = Runnable { fail(app.getString(R.string.send_timeout)) }

              fun init(context: Context) {
                  app = context.applicationContext
              }

              val isBusy: Boolean
                  get() = state == State.CONNECTING || state == State.SENDING ||
                          state == State.DONE || state == State.FAILED

              /** Vrai quand on a été touché depuis la Galerie Samsung et qu'on attend la photo partagée. */
              val awaitingGalleryUri: Boolean
                  get() = source == Source.GALLERY && uri == null &&
                          (state == State.ARMED || state == State.CONNECTING)

              fun addListener(l: Listener) {
                  listeners.add(l)
              }

              fun removeListener(l: Listener) {
                  listeners.remove(l)
              }

              // ---------- Commandes ----------

              fun arm(photo: Uri?, src: Source): Boolean {
                  if (isBusy) return false
                  if (!Permissions.allGranted(app)) return false
                  if (state == State.ARMED) stopRadios()
                  val t = ShareSession.start()
                  token = t
                  uri = photo
                  source = src
                  endpointId = null
                  filePayloadId = null
                  setState(State.ARMED)

                  val options = AdvertisingOptions.Builder().setStrategy(Strategy.P2P_POINT_TO_POINT).build()
                  client.startAdvertising(ShareSession.senderName(t), ShareSession.SERVICE_ID, lifecycleCallback, options)
                      .addOnFailureListener { /* le NFC et le Bluetooth restent actifs */ }
                  BleProximity.startAdvertising(app, t)
                  return true
              }

              /** Change la photo prête (swipe dans la visionneuse) ou fournit celle partagée par la Galerie. */
              fun provideUri(photo: Uri) {
                  if (state != State.ARMED && state != State.CONNECTING) return
                  uri = photo
                  trySend()
              }

              fun disarm(src: Source) {
                  if (isBusy || source != src) return
                  stopRadios()
                  setState(State.IDLE)
              }

              /** Un autre téléphone vient d'être collé (lecture NFC ou demande de connexion Nearby). */
              fun onTouched() {
                  if (state != State.ARMED) return
                  setState(State.CONNECTING)
                  main.removeCallbacks(timeout)
                  main.postDelayed(timeout, 25_000)
                  if (uri == null) {
                      val trigger = shareTrigger
                      if (trigger != null) trigger() else fail(app.getString(R.string.send_error))
                  }
              }

              fun fail(message: String) {
                  main.removeCallbacks(timeout)
                  stopRadios()
                  setState(State.FAILED, message = message)
                  main.postDelayed({ if (state == State.FAILED) setState(State.IDLE) }, 2000)
              }

              // ---------- Interne ----------

              private fun stopRadios() {
                  ShareSession.stop()
                  token = null
                  endpointId = null
                  filePayloadId = null
                  try {
                      client.stopAdvertising()
                      client.stopAllEndpoints()
                  } catch (_: Exception) {
                  }
                  BleProximity.stopAdvertising(app)
              }

              private fun setState(s: State, progress: Float = 0f, message: String? = null) {
                  state = s
                  if (s == State.IDLE) {
                      source = null
                      uri = null
                  }
                  // Diffusion asynchrone pour que chaque écouteur reçoive les états dans l'ordre.
                  main.post { listeners.forEach { it.onEngineUpdate(s, progress, message) } }
              }

              private val lifecycleCallback = object : ConnectionLifecycleCallback() {
                  override fun onConnectionInitiated(id: String, info: ConnectionInfo) {
                      val t = token
                      // On n'accepte que le téléphone qui a reçu NOTRE code (NFC ou Bluetooth).
                      if (t != null && info.endpointName == ShareSession.receiverName(t)) {
                          client.acceptConnection(id, payloadCallback)
                          onTouched()
                      } else {
                          client.rejectConnection(id)
                      }
                  }

                  override fun onConnectionResult(id: String, resolution: ConnectionResolution) {
                      if (resolution.status.isSuccess) {
                          endpointId = id
                          client.stopAdvertising()
                          BleProximity.stopAdvertising(app)
                          trySend()
                      } else {
                          fail(app.getString(R.string.send_error))
                      }
                  }

                  override fun onDisconnected(id: String) {
                      if (state == State.CONNECTING || state == State.SENDING) fail(app.getString(R.string.send_error))
                  }
              }

              private val payloadCallback = object : PayloadCallback() {
                  override fun onPayloadReceived(id: String, payload: Payload) {}

                  override fun onPayloadTransferUpdate(id: String, update: PayloadTransferUpdate) {
                      if (update.payloadId != filePayloadId) return
                      when (update.status) {
                          PayloadTransferUpdate.Status.IN_PROGRESS -> {
                              if (update.totalBytes > 0) {
                                  setState(State.SENDING, update.bytesTransferred.toFloat() / update.totalBytes)
                              }
                          }
                          PayloadTransferUpdate.Status.SUCCESS -> {
                              main.removeCallbacks(timeout)
                              setState(State.DONE, 1f)
                              main.postDelayed({
                                  if (state == State.DONE) {
                                      stopRadios()
                                      setState(State.IDLE)
                                  }
                              }, 1800)
                          }
                          PayloadTransferUpdate.Status.FAILURE,
                          PayloadTransferUpdate.Status.CANCELED -> fail(app.getString(R.string.send_error))
                      }
                  }
              }

              private fun trySend() {
                  val id = endpointId ?: return
                  val photo = uri ?: return
                  if (state != State.CONNECTING) return
                  val meta = MediaUtils.queryMeta(app, photo)
                  val pfd = try {
                      app.contentResolver.openFileDescriptor(photo, "r")
                  } catch (_: Exception) {
                      null
                  }
                  if (pfd == null) {
                      fail(app.getString(R.string.send_error))
                      return
                  }
                  val filePayload = Payload.fromFile(pfd)
                  filePayloadId = filePayload.id
                  val header = JSONObject()
                      .put("name", meta.name)
                      .put("mime", meta.mime)
                      .put("size", meta.size)
                      .put("payloadId", filePayload.id)
                      .toString()
                  setState(State.SENDING, 0f)
                  client.sendPayload(id, Payload.fromBytes(header.toByteArray(Charsets.UTF_8)))
                  client.sendPayload(id, filePayload)
              }
          }
          FLOWSHARE_EOF

      - name: "Fichier app/src/main/java/com/flowshare/app/SetupActivity.kt"
        run: |
          mkdir -p "FlowShare/app/src/main/java/com/flowshare/app"
          cat > "FlowShare/app/src/main/java/com/flowshare/app/SetupActivity.kt" <<'FLOWSHARE_EOF'
          package com.flowshare.app

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.nfc.NfcAdapter
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.provider.Settings
          import android.view.View
          import android.widget.Button
          import android.widget.SeekBar
          import android.widget.TextView
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts

          /** Réglages : autorisations, NFC, Bluetooth, accessibilité, sensibilité du rapprochement. */
          class SetupActivity : ComponentActivity() {

              private lateinit var status: TextView
              private lateinit var btnPermissions: Button
              private lateinit var btnNfc: Button
              private lateinit var btnBluetooth: Button
              private lateinit var btnAccessibility: Button
              private lateinit var btnRestricted: Button
              private lateinit var sensitivityLabel: TextView
              private lateinit var liveSignal: TextView
              private lateinit var seek: SeekBar

              private val handler = Handler(Looper.getMainLooper())
              private val ticker = object : Runnable {
                  override fun run() {
                      updateLiveSignal()
                      handler.postDelayed(this, 500)
                  }
              }

              private val askPermissions =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { refresh() }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_setup)
                  status = findViewById(R.id.status)
                  btnPermissions = findViewById(R.id.btnPermissions)
                  btnNfc = findViewById(R.id.btnNfc)
                  btnBluetooth = findViewById(R.id.btnBluetooth)
                  btnAccessibility = findViewById(R.id.btnAccessibility)
                  btnRestricted = findViewById(R.id.btnRestricted)
                  sensitivityLabel = findViewById(R.id.sensitivityLabel)
                  liveSignal = findViewById(R.id.liveSignal)
                  seek = findViewById(R.id.seekSensitivity)

                  btnPermissions.setOnClickListener { askPermissions.launch(Permissions.required()) }
                  btnNfc.setOnClickListener { open(Settings.ACTION_NFC_SETTINGS) }
                  btnBluetooth.setOnClickListener { open(Settings.ACTION_BLUETOOTH_SETTINGS) }
                  btnAccessibility.setOnClickListener { open(Settings.ACTION_ACCESSIBILITY_SETTINGS) }
                  btnRestricted.setOnClickListener {
                      open(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:$packageName"))
                  }

                  // La barre va de "peu sensible" (il faut vraiment coller) à "très sensible".
                  seek.max = Prefs.MAX_RSSI - Prefs.MIN_RSSI
                  seek.progress = Prefs.MAX_RSSI - Prefs.rssiThreshold(this)
                  updateSensitivityLabel()
                  seek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(bar: SeekBar, value: Int, fromUser: Boolean) {
                          if (fromUser) {
                              Prefs.setRssiThreshold(this@SetupActivity, Prefs.MAX_RSSI - value)
                              updateSensitivityLabel()
                          }
                      }

                      override fun onStartTrackingTouch(bar: SeekBar) {}
                      override fun onStopTrackingTouch(bar: SeekBar) {}
                  })
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
                  handler.post(ticker)
              }

              override fun onPause() {
                  super.onPause()
                  handler.removeCallbacks(ticker)
              }

              private fun open(action: String, target: Uri? = null) {
                  try {
                      val intent = Intent(action)
                      if (target != null) intent.data = target
                      startActivity(intent)
                  } catch (_: Exception) {
                      startActivity(Intent(Settings.ACTION_SETTINGS))
                  }
              }

              private fun refresh() {
                  val nfc = NfcAdapter.getDefaultAdapter(this)
                  val perms = Permissions.allGranted(this)
                  val nfcOn = nfc?.isEnabled == true
                  val btOn = BleProximity.isBluetoothOn(this)
                  val a11y = FlowAccessibilityService.isEnabled(this)

                  btnPermissions.visibility = if (perms) View.GONE else View.VISIBLE
                  btnNfc.visibility = if (nfc != null && !nfcOn) View.VISIBLE else View.GONE
                  btnBluetooth.visibility = if (btOn) View.GONE else View.VISIBLE
                  btnAccessibility.visibility = if (a11y) View.GONE else View.VISIBLE
                  btnRestricted.visibility = if (a11y) View.GONE else View.VISIBLE

                  status.text = buildString {
                      appendLine(line(perms, getString(R.string.check_perms)))
                      appendLine(
                          when {
                              nfc == null -> "✗ " + getString(R.string.check_no_nfc)
                              else -> line(nfcOn, getString(R.string.check_nfc))
                          }
                      )
                      appendLine(line(btOn, getString(R.string.check_bt)))
                      append(line(a11y, getString(R.string.check_a11y)))
                  }
              }

              private fun line(ok: Boolean, label: String) = (if (ok) "✓ " else "✗ ") + label

              private fun updateSensitivityLabel() {
                  sensitivityLabel.text = getString(R.string.sensitivity_value, Prefs.rssiThreshold(this))
              }

              private fun updateLiveSignal() {
                  val rssi = BleProximity.lastRssi
                  val age = SystemClock.elapsedRealtime() - BleProximity.lastSeenAt
                  liveSignal.text = if (rssi != null && age < 3000) {
                      getString(R.string.live_signal, rssi)
                  } else {
                      getString(R.string.live_signal_none)
                  }
              }

              companion object {
                  fun isReady(context: Context): Boolean =
                      Permissions.allGranted(context) &&
                              BleProximity.isBluetoothOn(context) &&
                              FlowAccessibilityService.isEnabled(context)
              }
          }
          FLOWSHARE_EOF

      - name: "Fichier app/src/main/java/com/flowshare/app/ShareSession.kt"
        run: |
          mkdir -p "FlowShare/app/src/main/java/com/flowshare/app"
          cat > "FlowShare/app/src/main/java/com/flowshare/app/ShareSession.kt" <<'FLOWSHARE_EOF'
          package com.flowshare.app

          import android.os.Handler
          import android.os.Looper
          import java.security.SecureRandom

          /**
           * Code de session partagé entre le moteur d'envoi, le service NFC et le Bluetooth.
           * Tant qu'un [token] existe, le téléphone "répond" quand on l'approche d'un autre.
           */
          object ShareSession {
              const val MIME_TOKEN = "application/vnd.com.flowshare.token"
              const val SERVICE_ID = "com.flowshare.app.transfer"
              const val EXTRA_TOKEN = "com.flowshare.app.TOKEN"

              private const val ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"
              private val random = SecureRandom()
              private val main = Handler(Looper.getMainLooper())

              @Volatile
              var token: String? = null
                  private set

              fun start(): String {
                  val t = buildString { repeat(8) { append(ALPHABET[random.nextInt(ALPHABET.length)]) } }
                  token = t
                  return t
              }

              fun stop() {
                  token = null
              }

              /** Appelé par le service NFC quand un autre téléphone vient de nous lire. */
              fun notifyTouched() {
                  main.post { SenderEngine.onTouched() }
              }

              fun senderName(token: String) = "FS-$token"
              fun receiverName(token: String) = "FSR-$token"
          }
          FLOWSHARE_EOF

