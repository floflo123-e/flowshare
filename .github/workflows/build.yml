name: Construire l'APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: "Fichier .gitignore"
        run: |
          mkdir -p "FlowShare/."
          cat > "FlowShare/.gitignore" <<'FLOWSHARE_EOF'
          .gradle/
          build/
          app/build/
          local.properties
          .idea/
          *.iml
          FLOWSHARE_EOF

      - name: "Fichier app/build.gradle.kts"
        run: |
          mkdir -p "FlowShare/app"
          cat > "FlowShare/app/build.gradle.kts" <<'FLOWSHARE_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.flowshare.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.flowshare.app"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      // Prototype : signé avec la clé de debug pour pouvoir l'installer directement.
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.3")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("com.google.android.gms:play-services-nearby:19.3.0")
          }
          FLOWSHARE_EOF

      - name: "Fichier app/src/main/AndroidManifest.xml"
        run: |
          mkdir -p "FlowShare/app/src/main"
          cat > "FlowShare/app/src/main/AndroidManifest.xml" <<'FLOWSHARE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- NFC : le "rapprochement" des téléphones -->
              <uses-permission android:name="android.permission.NFC" />
              <uses-feature android:name="android.hardware.nfc" android:required="false" />
              <uses-feature android:name="android.hardware.nfc.hce" android:required="false" />

              <!-- Nearby Connections : le transfert rapide (Bluetooth + Wi-Fi direct) -->
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <!-- Galerie intégrée -->
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />

              <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />

              <uses-permission
                  android:name="android.permission.NEARBY_WIFI_DEVICES"
                  android:usesPermissionFlags="neverForLocation" />

              <application
                  android:name=".FlowApp"
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.FlowShare">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <!-- Écran d'envoi : ouvert depuis la Galerie via "Partager" ou "Ouvrir avec" -->
                  <activity
                      android:name=".SendActivity"
                      android:exported="true"
                      android:label="@string/send_label"
                      android:launchMode="singleTask"
                      android:theme="@style/Theme.FlowShare.Fullscreen">
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="image/*" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="image/*" />
                      </intent-filter>
                  </activity>

                  <!-- Écran de réception : lancé automatiquement par le système quand on
                       approche un téléphone qui envoie, même si l'app est fermée. -->
                  <activity
                      android:name=".ReceiveActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:excludeFromRecents="true"
                      android:theme="@style/Theme.FlowShare.Fullscreen">
                      <intent-filter>
                          <action android:name="android.nfc.action.NDEF_DISCOVERED" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="application/vnd.com.flowshare.token" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".SetupActivity"
                      android:exported="false"
                      android:label="@string/settings" />

                  <!-- Pont vers la Galerie Samsung + écoute Bluetooth (sans notification permanente) -->
                  <service
                      android:name=".FlowAccessibilityService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service" />
                  </service>

                  <!-- Le téléphone qui envoie se fait passer pour une "puce NFC" -->
                  <service
                      android:name=".FlowHceService"
                      android:exported="true"
                      android:permission="android.permission.BIND_NFC_SERVICE">
                      <intent-filter>
                          <action android:name="android.nfc.cardemulation.action.HOST_APDU_SERVICE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.nfc.cardemulation.host_apdu_service"
                          android:resource="@xml/apduservice" />
                  </service>
              </application>
          </manifest>
          FLOWSHARE_EOF

      - name: "Fichier app/src/main/java/com/flowshare/app/BleProximity.kt"
        run: |
          mkdir -p "FlowShare/app/src/main/java/com/flowshare/app"
          cat > "FlowShare/app/src/main/java/com/flowshare/app/BleProximity.kt" <<'FLOWSHARE_EOF'
          package com.flowshare.app

          import android.annotation.SuppressLint
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothManager
          import android.bluetooth.le.AdvertiseCallback
          import android.bluetooth.le.AdvertiseData
          import android.bluetooth.le.AdvertiseSettings
          import android.bluetooth.le.ScanCallback
          import android.bluetooth.le.ScanFilter
          import android.bluetooth.le.ScanResult
          import android.bluetooth.le.ScanSettings
          import android.content.Context
          import android.os.ParcelUuid
          import android.os.SystemClock

          /**
           * Détection du rapprochement par Bluetooth Low Energy.
           *
           *  - Le téléphone qui a une photo prête diffuse un petit signal contenant le code de session.
           *  - Les autres téléphones écoutent. Quand le signal devient très fort (téléphones collés),
           *    on déclenche la réception.
           *
           * Fonctionne quelle que soit l'orientation (haut contre haut, dos à dos…),
           * contrairement au NFC qui exige d'aligner les antennes.
           */
          @SuppressLint("MissingPermission")
          object BleProximity {

              val SERVICE_UUID: ParcelUuid = ParcelUuid.fromString("0000F1A5-0000-1000-8000-00805F9B34FB")

              private const val HITS_NEEDED = 2
              private const val HIT_WINDOW_MS = 1500L

              private class Hit(var count: Int, var time: Long)

              private val hits = HashMap<String, Hit>()
              private var appContext: Context? = null
              private var scanning = false
              private var advertising = false

              /** Dernier signal FlowShare capté (pour l'écran de réglage de la sensibilité). */
              @Volatile
              var lastRssi: Int? = null
                  private set

              @Volatile
              var lastSeenAt: Long = 0L
                  private set

              /** Appelé sur le thread principal quand un téléphone qui envoie est collé au nôtre. */
              var onProximity: ((String) -> Unit)? = null

              private fun adapter(context: Context): BluetoothAdapter? =
                  context.getSystemService(BluetoothManager::class.java)?.adapter

              fun isBluetoothOn(context: Context): Boolean = adapter(context)?.isEnabled == true

              // ---------- Diffusion (téléphone qui envoie) ----------

              private val advertiseCallback = object : AdvertiseCallback() {
                  override fun onStartFailure(errorCode: Int) {
                      advertising = false
                  }
              }

              fun startAdvertising(context: Context, token: String) {
                  stopAdvertising(context)
                  val adapter = adapter(context) ?: return
                  if (!adapter.isEnabled || !Permissions.allGranted(context)) return
                  val advertiser = adapter.bluetoothLeAdvertiser ?: return
                  val settings = AdvertiseSettings.Builder()
                      .setAdvertiseMode(AdvertiseSettings.ADVERTISE_MODE_LOW_LATENCY)
                      .setTxPowerLevel(AdvertiseSettings.ADVERTISE_TX_POWER_MEDIUM)
                      .setConnectable(false)
                      .setTimeout(0)
                      .build()
                  val data = AdvertiseData.Builder()
                      .setIncludeDeviceName(false)
                      .setIncludeTxPowerLevel(false)
                      .addServiceData(SERVICE_UUID, token.toByteArray(Charsets.US_ASCII))
                      .build()
                  try {
                      advertiser.startAdvertising(settings, data, advertiseCallback)
                      advertising = true
                  } catch (_: Exception) {
                      advertising = false
                  }
              }

              fun stopAdvertising(context: Context) {
                  if (!advertising) return
                  advertising = false
                  try {
                      adapter(context)?.bluetoothLeAdvertiser?.stopAdvertising(advertiseCallback)
                  } catch (_: Exception) {
                  }
              }

              // ---------- Écoute (téléphone qui reçoit) ----------

              private val scanCallback = object : ScanCallback() {
                  override fun onScanResult(callbackType: Int, result: ScanResult) {
                      handle(result)
                  }

                  override fun onBatchScanResults(results: MutableList<ScanResult>) {
                      results.forEach { handle(it) }
                  }

                  override fun onScanFailed(errorCode: Int) {
                      scanning = false
                  }
              }

              fun startScan(context: Context) {
                  if (scanning) return
                  appContext = context.applicationContext
                  val adapter = adapter(context) ?: return
                  if (!adapter.isEnabled || !Permissions.allGranted(context)) return
                  val scanner = adapter.bluetoothLeScanner ?: return
                  val filter = ScanFilter.Builder()
                      .setServiceData(SERVICE_UUID, ByteArray(0), ByteArray(0))
                      .build()
                  val settings = ScanSettings.Builder()
                      .setScanMode(ScanSettings.SCAN_MODE_LOW_LATENCY)
                      .setReportDelay(0)
                      .build()
                  try {
                      scanner.startScan(listOf(filter), settings, scanCallback)
                      scanning = true
                  } catch (_: Exception) {
                      scanning = false
                  }
              }

              fun stopScan(context: Context) {
                  if (!scanning) return
                  scanning = false
                  hits.clear()
                  try {
                      adapter(context)?.bluetoothLeScanner?.stopScan(scanCallback)
                  } catch (_: Exception) {
                  }
              }

              private fun handle(result: ScanResult) {
                  val data = result.scanRecord?.getServiceData(SERVICE_UUID) ?: return
                  if (data.isEmpty()) return
                  val token = String(data, Charsets.US_ASCII)
                  val now = SystemClock.elapsedRealtime()
                  lastRssi = result.rssi
                  lastSeenAt = now

                  val ctx = appContext ?: return
                  if (result.rssi < Prefs.rssiThreshold(ctx)) {
                      hits.remove(token)
                      return
                  }
                  val hit = hits[token]
                  if (hit != null && now - hit.time < HIT_WINDOW_MS) {
                      hit.count++
                      hit.time = now
                  } else {
                      hits[token] = Hit(1, now)
                  }
                  if ((hits[token]?.count ?: 0) >= HITS_NEEDED) {
                      hits.remove(token)
                      onProximity?.invoke(token)
                  }
              }
          }
          FLOWSHARE_EOF

      - name: "Fichier app/src/main/java/com/flowshare/app/FlowAccessibilityService.kt"
        run: |
          mkdir -p "FlowShare/app/src/main/java/com/flowshare/app"
          cat > "FlowShare/app/src/main/java/com/flowshare/app/FlowAccessibilityService.kt" <<'FLOWSHARE_EOF'
          package com.flowshare.app

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.app.KeyguardManager
          import android.bluetooth.BluetoothAdapter
          import android.content.BroadcastReceiver
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Path
          import android.graphics.Rect
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.os.SystemClock
          import android.provider.Settings
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Toast
          import androidx.core.content.ContextCompat

          /**
           * Le "pont" vers la Galerie Samsung (et d'autres galeries).
           *
           *  1. Il repère quand une photo est ouverte en plein écran (le bouton "Partager" est visible)
           *     et prépare l'envoi : NFC + Bluetooth actifs.
           *  2. Quand on colle un autre téléphone, il appuie lui-même sur Partager › FlowShare :
           *     la vraie photo (pleine qualité) arrive dans FlowShare et part aussitôt.
           *  3. Côté réception, il écoute le Bluetooth en permanence (écran allumé) et ouvre
           *     FlowShare tout seul quand un téléphone qui envoie est collé.
           *
           * Un service d'accessibilité reste actif sans notification permanente.
           */
          class FlowAccessibilityService : AccessibilityService(), SenderEngine.Listener {

              private val handler = Handler(Looper.getMainLooper())
              private var galleryArmed = false

              // Automatisation du menu Partager
              private var autoActive = false
              private var autoStartedAt = 0L
              private var lastScrollAt = 0L
              private var scrollTries = 0

              // Évite d'ouvrir deux fois la réception pour le même envoi
              private val recentTokens = HashMap<String, Long>()

              private val evaluate = Runnable { evaluateForeground() }
              private val autoStep = Runnable { stepAutoShare() }
              private val autoTimeout = Runnable { stopAutoShare(success = false) }

              private val systemReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      when (intent.action) {
                          Intent.ACTION_SCREEN_OFF -> BleProximity.stopScan(this@FlowAccessibilityService)
                          Intent.ACTION_SCREEN_ON, Intent.ACTION_USER_PRESENT -> startScanIfPossible()
                          BluetoothAdapter.ACTION_STATE_CHANGED -> {
                              val s = intent.getIntExtra(BluetoothAdapter.EXTRA_STATE, BluetoothAdapter.ERROR)
                              if (s == BluetoothAdapter.STATE_ON) startScanIfPossible()
                              else if (s == BluetoothAdapter.STATE_OFF) BleProximity.stopScan(this@FlowAccessibilityService)
                          }
                      }
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  val filter = IntentFilter().apply {
                      addAction(Intent.ACTION_SCREEN_ON)
                      addAction(Intent.ACTION_SCREEN_OFF)
                      addAction(Intent.ACTION_USER_PRESENT)
                      addAction(BluetoothAdapter.ACTION_STATE_CHANGED)
                  }
                  ContextCompat.registerReceiver(this, systemReceiver, filter, ContextCompat.RECEIVER_NOT_EXPORTED)
                  SenderEngine.addListener(this)
                  SenderEngine.shareTrigger = { startAutoShare() }
                  BleProximity.onProximity = { token -> onProximity(token) }
                  startScanIfPossible()
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  try {
                      unregisterReceiver(systemReceiver)
                  } catch (_: Exception) {
                  }
                  SenderEngine.removeListener(this)
                  SenderEngine.shareTrigger = null
                  BleProximity.onProximity = null
                  BleProximity.stopScan(this)
                  if (galleryArmed) SenderEngine.disarm(SenderEngine.Source.GALLERY)
                  super.onDestroy()
              }

              override fun onInterrupt() {}

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  val pkg = event?.packageName?.toString() ?: return
                  if (autoActive) {
                      handler.removeCallbacks(autoStep)
                      handler.postDelayed(autoStep, 200)
                      return
                  }
                  if (pkg == packageName) return
                  if (pkg !in GALLERY_PACKAGES && !galleryArmed) return
                  handler.removeCallbacks(evaluate)
                  handler.postDelayed(evaluate, 300)
              }

              override fun onEngineUpdate(state: SenderEngine.State, progress: Float, message: String?) {
                  if (state == SenderEngine.State.IDLE) {
                      galleryArmed = false
                      handler.removeCallbacks(evaluate)
                      handler.postDelayed(evaluate, 500)
                  }
                  if (state == SenderEngine.State.FAILED && autoActive) stopAutoShare(success = false, silent = true)
              }

              // ---------- 1. Repérer une photo ouverte dans la Galerie ----------

              private fun evaluateForeground() {
                  if (autoActive) return
                  val root = rootInActiveWindow ?: return
                  val pkg = root.packageName?.toString() ?: return
                  if (pkg == packageName) return
                  val viewerOpen = pkg in GALLERY_PACKAGES && findShareButton(root) != null
                  if (viewerOpen && !galleryArmed) {
                      if (SenderEngine.state == SenderEngine.State.IDLE || SenderEngine.source == SenderEngine.Source.GALLERY) {
                          galleryArmed = SenderEngine.arm(null, SenderEngine.Source.GALLERY)
                      }
                  } else if (!viewerOpen && galleryArmed) {
                      galleryArmed = false
                      SenderEngine.disarm(SenderEngine.Source.GALLERY)
                  }
              }

              private fun findShareButton(root: AccessibilityNodeInfo): AccessibilityNodeInfo? =
                  findNode(root) { node ->
                      if (!node.isVisibleToUser) return@findNode false
                      val label = (node.contentDescription ?: node.text)?.toString()?.trim() ?: return@findNode false
                      SHARE_LABELS.any { it.equals(label, ignoreCase = true) }
                  }

              // ---------- 2. Appuyer sur Partager › FlowShare ----------

              private fun startAutoShare() {
                  val root = rootInActiveWindow
                  val share = root?.let { findShareButton(it) }
                  if (share == null || !click(share)) {
                      SenderEngine.fail(getString(R.string.auto_no_share))
                      return
                  }
                  autoActive = true
                  autoStartedAt = SystemClock.elapsedRealtime()
                  lastScrollAt = 0L
                  scrollTries = 0
                  handler.postDelayed(autoStep, 500)
                  handler.postDelayed(autoTimeout, 7000)
              }

              private fun stepAutoShare() {
                  if (!autoActive) return
                  val target = findInAllWindows { node ->
                      node.packageName?.toString() != packageName &&
                              ((node.text?.toString()?.contains(TARGET_LABEL, ignoreCase = true) == true) ||
                                      (node.contentDescription?.toString()?.contains(TARGET_LABEL, ignoreCase = true) == true))
                  }
                  if (target != null && click(target)) {
                      stopAutoShare(success = true)
                      return
                  }
                  // FlowShare n'est pas visible dans le menu : on fait défiler la liste des apps.
                  val now = SystemClock.elapsedRealtime()
                  if (now - autoStartedAt > 1200 && now - lastScrollAt > 700 && scrollTries < 6) {
                      lastScrollAt = now
                      scrollTries++
                      rootInActiveWindow?.let { root ->
                          findNode(root) { it.isScrollable && it.isVisibleToUser }
                              ?.performAction(AccessibilityNodeInfo.ACTION_SCROLL_FORWARD)
                      }
                  }
                  handler.postDelayed(autoStep, 400)
              }

              private fun stopAutoShare(success: Boolean, silent: Boolean = false) {
                  if (!autoActive) return
                  autoActive = false
                  handler.removeCallbacks(autoStep)
                  handler.removeCallbacks(autoTimeout)
                  if (!success && !silent) {
                      Toast.makeText(this, R.string.auto_not_found, Toast.LENGTH_LONG).show()
                      SenderEngine.fail(getString(R.string.auto_not_found))
                  }
              }

              // ---------- 3. Réception déclenchée par le Bluetooth ----------

              private fun startScanIfPossible() {
                  val power = getSystemService(PowerManager::class.java)
                  if (power?.isInteractive == true) BleProximity.startScan(this)
              }

              private fun onProximity(token: String) {
                  // Ce téléphone a lui-même une photo prête : c'est lui qui envoie, pas lui qui reçoit.
                  if (SenderEngine.state != SenderEngine.State.IDLE) return
                  val keyguard = getSystemService(KeyguardManager::class.java)
                  if (keyguard?.isKeyguardLocked == true) return
                  val now = SystemClock.elapsedRealtime()
                  recentTokens.entries.removeAll { now - it.value > 60_000 }
                  if (recentTokens.containsKey(token)) return
                  recentTokens[token] = now
                  val intent = Intent(this, ReceiveActivity::class.java)
                      .putExtra(ShareSession.EXTRA_TOKEN, token)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  try {
                      startActivity(intent)
                  } catch (_: Exception) {
                  }
              }

              // ---------- Outils ----------

              private fun click(node: AccessibilityNodeInfo): Boolean {
                  var n: AccessibilityNodeInfo? = node
                  while (n != null && !n.isClickable) n = n.parent
                  if (n != null && n.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return true
                  // Plan B : un vrai "tap" au centre de l'élément.
                  val r = Rect()
                  node.getBoundsInScreen(r)
                  if (r.isEmpty) return false
                  val path = Path().apply { moveTo(r.exactCenterX(), r.exactCenterY()) }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 60))
                      .build()
                  return dispatchGesture(gesture, null, null)
              }

              private fun findInAllWindows(match: (AccessibilityNodeInfo) -> Boolean): AccessibilityNodeInfo? {
                  val roots = try {
                      windows.mapNotNull { it.root }
                  } catch (_: Exception) {
                      emptyList()
                  }
                  for (root in roots) findNode(root, match)?.let { return it }
                  return rootInActiveWindow?.let { findNode(it, match) }
              }

              private fun findNode(
                  root: AccessibilityNodeInfo,
                  match: (AccessibilityNodeInfo) -> Boolean
              ): AccessibilityNodeInfo? {
                  val queue = ArrayDeque<AccessibilityNodeInfo>()
                  queue.add(root)
                  var visited = 0
                  while (queue.isNotEmpty() && visited < 1500) {
                      val node = queue.removeFirst()
                      visited++
                      if (match(node)) return node
                      for (i in 0 until node.childCount) node.getChild(i)?.let { queue.add(it) }
                  }
                  return null
              }

              companion object {
                  private const val TARGET_LABEL = "FlowShare"

                  val GALLERY_PACKAGES = setOf(
                      "com.sec.android.gallery3d",          // Galerie Samsung
                      "com.google.android.apps.photos",     // Google Photos
                      "com.miui.gallery",                   // Xiaomi
                      "com.coloros.gallery3d",              // Oppo / OnePlus
                      "com.oneplus.gallery",
                      "com.vivo.gallery",
                      "com.huawei.photos"
                  )

                  private val SHARE_LABELS = listOf(
                      "Partager", "Share", "Compartir", "Teilen", "Condividi", "Partilhar", "Delen"
                  )

                  fun isEnabled(context: Context): Boolean {
                      val enabled = Settings.Secure.getString(
                          context.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                      ) ?: return false
                      val me = ComponentName(context, FlowAccessibilityService::class.java)
                      return enabled.split(':').any {
                          ComponentName.unflattenFromString(it) == me
                      }
                  }
              }
          }
          FLOWSHARE_EOF

      - name: "Fichier app/src/main/java/com/flowshare/app/FlowApp.kt"
        run: |
          mkdir -p "FlowShare/app/src/main/java/com/flowshare/app"
          cat > "FlowShare/app/src/main/java/com/flowshare/app/FlowApp.kt" <<'FLOWSHARE_EOF'
          package com.flowshare.app

          import android.app.Application

          class FlowApp : Application() {
              override fun onCreate() {
                  super.onCreate()
                  SenderEngine.init(this)
              }
          }
          FLOWSHARE_EOF

      - name: "Fichier app/src/main/java/com/flowshare/app/FlowHceService.kt"
        run: |
          mkdir -p "FlowShare/app/src/main/java/com/flowshare/app"
          cat > "FlowShare/app/src/main/java/com/flowshare/app/FlowHceService.kt" <<'FLOWSHARE_EOF'
          package com.flowshare.app

          import android.nfc.NdefMessage
          import android.nfc.NdefRecord
          import android.nfc.cardemulation.HostApduService
          import android.os.Bundle

          /**
           * Le téléphone qui envoie émule une puce NFC "Type 4" contenant un petit message :
           *  - un code de session (token) pour retrouver ce téléphone via Nearby,
           *  - un "Android Application Record" qui fait ouvrir FlowShare sur l'autre téléphone,
           *    même si l'app y est fermée.
           *
           * Le service ne répond que lorsqu'une photo est prête à être envoyée ;
           * le reste du temps il reste muet et ne gêne pas le paiement sans contact.
           */
          class FlowHceService : HostApduService() {

              private var selectedFile = FILE_NONE
              private var ndefFile: ByteArray? = null
              private var notified = false

              override fun processCommandApdu(apdu: ByteArray, extras: Bundle?): ByteArray {
                  if (apdu.size < 4) return SW_INS_NOT_SUPPORTED
                  val ins = apdu[1].toInt() and 0xFF
                  val p1 = apdu[2].toInt() and 0xFF
                  val p2 = apdu[3].toInt() and 0xFF
                  return when (ins) {
                      0xA4 -> handleSelect(apdu, p1)
                      0xB0 -> handleReadBinary(apdu, p1, p2)
                      else -> SW_INS_NOT_SUPPORTED
                  }
              }

              private fun handleSelect(apdu: ByteArray, p1: Int): ByteArray {
                  if (apdu.size < 5) return SW_NOT_FOUND
                  val lc = apdu[4].toInt() and 0xFF
                  if (apdu.size < 5 + lc) return SW_NOT_FOUND
                  val data = apdu.copyOfRange(5, 5 + lc)

                  // SELECT par AID (application NDEF)
                  if (p1 == 0x04) {
                      if (!data.contentEquals(NDEF_AID)) return SW_NOT_FOUND
                      val token = ShareSession.token ?: return SW_NOT_FOUND
                      ndefFile = buildNdefFile(token)
                      selectedFile = FILE_NONE
                      notified = false
                      return SW_OK
                  }

                  // SELECT par identifiant de fichier (CC ou NDEF)
                  if (p1 == 0x00 && ndefFile != null) {
                      selectedFile = when {
                          data.contentEquals(CC_FILE_ID) -> FILE_CC
                          data.contentEquals(NDEF_FILE_ID) -> FILE_NDEF
                          else -> return SW_NOT_FOUND
                      }
                      return SW_OK
                  }
                  return SW_NOT_FOUND
              }

              private fun handleReadBinary(apdu: ByteArray, p1: Int, p2: Int): ByteArray {
                  val file = when (selectedFile) {
                      FILE_CC -> CC_FILE
                      FILE_NDEF -> ndefFile ?: return SW_NOT_FOUND
                      else -> return SW_NOT_FOUND
                  }
                  val offset = (p1 shl 8) or p2
                  var le = if (apdu.size >= 5) apdu[4].toInt() and 0xFF else 0
                  if (le == 0) le = 256
                  if (offset > file.size) return SW_WRONG_PARAMS
                  val end = minOf(file.size, offset + le)

                  // Dès que l'autre téléphone lit le contenu, on lance l'animation côté envoi.
                  if (selectedFile == FILE_NDEF && end > 2 && !notified) {
                      notified = true
                      ShareSession.notifyTouched()
                  }
                  return file.copyOfRange(offset, end) + SW_OK
              }

              override fun onDeactivated(reason: Int) {
                  selectedFile = FILE_NONE
              }

              private fun buildNdefFile(token: String): ByteArray {
                  val message = NdefMessage(
                      NdefRecord.createMime(ShareSession.MIME_TOKEN, token.toByteArray(Charsets.UTF_8)),
                      NdefRecord.createApplicationRecord(packageName)
                  ).toByteArray()
                  val n = message.size
                  return byteArrayOf((n shr 8).toByte(), n.toByte()) + message
              }

              companion object {
                  private const val FILE_NONE = 0
                  private const val FILE_CC = 1
                  private const val FILE_NDEF = 2

                  private val NDEF_AID = hex("D2760000850101")
                  private val CC_FILE_ID = hex("E103")
                  private val NDEF_FILE_ID = hex("E104")

                  // Capability Container : version 2.0, lecture par blocs de 127 octets,
                  // fichier NDEF E104 de 4 Ko max, lecture libre, écriture interdite.
                  private val CC_FILE = hex("000F20007F007F0406E104100000FF")

                  private val SW_OK = hex("9000")
                  private val SW_NOT_FOUND = hex("6A82")
                  private val SW_WRONG_PARAMS = hex("6B00")
                  private val SW_INS_NOT_SUPPORTED = hex("6D00")

                  private fun hex(s: String): ByteArray =
                      ByteArray(s.length / 2) { i -> s.substring(i * 2, i * 2 + 2).toInt(16).toByte() }
              }
          }
          FLOWSHARE_EOF

      - name: "Fichier app/src/main/java/com/flowshare/app/GlowEdgeView.kt"
        run: |
          mkdir -p "FlowShare/app/src/main/java/com/flowshare/app"
          cat > "FlowShare/app/src/main/java/com/flowshare/app/GlowEdgeView.kt" <<'FLOWSHARE_EOF'
          package com.flowshare.app

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RadialGradient
          import android.graphics.Shader
          import android.util.AttributeSet
          import android.view.View
          import android.view.animation.DecelerateInterpolator

          /**
           * La lueur blanche/bleue qui apparaît sur le bord de l'écran,
           * comme dans la vidéo, avec une légère pulsation.
           */
          class GlowEdgeView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null
          ) : View(context, attrs) {

              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private var intensity = 0f
              private var pulse = 0f
              private var intensityAnimator: ValueAnimator? = null
              private var pulseAnimator: ValueAnimator? = null

              fun setIntensity(target: Float, durationMs: Long = 450L) {
                  intensityAnimator?.cancel()
                  intensityAnimator = ValueAnimator.ofFloat(intensity, target).apply {
                      duration = durationMs
                      interpolator = DecelerateInterpolator()
                      addUpdateListener {
                          intensity = it.animatedValue as Float
                          invalidate()
                      }
                      start()
                  }
              }

              fun startPulse() {
                  if (pulseAnimator != null) return
                  pulseAnimator = ValueAnimator.ofFloat(0f, 1f).apply {
                      duration = 1100L
                      repeatMode = ValueAnimator.REVERSE
                      repeatCount = ValueAnimator.INFINITE
                      addUpdateListener {
                          pulse = it.animatedValue as Float
                          invalidate()
                      }
                      start()
                  }
              }

              fun stopPulse() {
                  pulseAnimator?.cancel()
                  pulseAnimator = null
                  pulse = 0f
                  invalidate()
              }

              override fun onDetachedFromWindow() {
                  super.onDetachedFromWindow()
                  intensityAnimator?.cancel()
                  pulseAnimator?.cancel()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (intensity <= 0.01f || width == 0) return
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val radius = w * (0.8f + 0.15f * pulse) * (0.5f + 0.5f * intensity)
                  val a = (intensity * (0.8f + 0.2f * pulse)).coerceIn(0f, 1f)
                  paint.shader = RadialGradient(
                      w / 2f, -radius * 0.2f, radius,
                      intArrayOf(
                          withAlpha(Color.WHITE, a),
                          withAlpha(0xFF8FD3FF.toInt(), a * 0.75f),
                          withAlpha(0xFF4B6BFF.toInt(), a * 0.3f),
                          Color.TRANSPARENT
                      ),
                      floatArrayOf(0f, 0.35f, 0.7f, 1f),
                      Shader.TileMode.CLAMP
                  )
                  canvas.drawRect(0f, 0f, w, minOf(h, radius), paint)
              }

              private fun withAlpha(color: Int, alpha: Float): Int =
                  Color.argb((255 * alpha).toInt().coerceIn(0, 255), Color.red(color), Color.green(color), Color.blue(color))
          }
          FLOWSHARE_EOF

      - name: "Fichier app/src/main/java/com/flowshare/app/MainActivity.kt"
        run: |
          mkdir -p "FlowShare/app/src/main/java/com/flowshare/app"
          cat > "FlowShare/app/src/main/java/com/flowshare/app/MainActivity.kt" <<'FLOWSHARE_EOF'
          package com.flowshare.app

          import android.Manifest
          import android.content.ContentUris
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.util.AttributeSet
          import android.util.LruCache
          import android.util.Size
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.core.content.ContextCompat
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import java.util.concurrent.Executors

          /**
           * La galerie FlowShare : toutes tes photos. Touche une photo pour l'ouvrir,
           * puis colle ton téléphone contre un autre : elle part.
           */
          class MainActivity : ComponentActivity() {

              private lateinit var banner: TextView
              private lateinit var btnPhotos: Button
              private lateinit var grid: RecyclerView

              private val ids = ArrayList<Long>()
              private val io = Executors.newFixedThreadPool(3)
              private val cache = object : LruCache<Long, Bitmap>(
                  (Runtime.getRuntime().maxMemory() / 1024 / 8).toInt()
              ) {
                  override fun sizeOf(key: Long, value: Bitmap) = value.byteCount / 1024
              }

              private val askPhotos =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { refresh() }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  banner = findViewById(R.id.banner)
                  btnPhotos = findViewById(R.id.btnPhotos)
                  grid = findViewById(R.id.grid)

                  findViewById<View>(R.id.btnSettings).setOnClickListener {
                      startActivity(Intent(this, SetupActivity::class.java))
                  }
                  banner.setOnClickListener { startActivity(Intent(this, SetupActivity::class.java)) }
                  btnPhotos.setOnClickListener { askPhotos.launch(photoPermissions()) }

                  grid.layoutManager = GridLayoutManager(this, 3)
                  grid.adapter = adapter
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  io.shutdownNow()
              }

              private fun refresh() {
                  banner.visibility = if (SetupActivity.isReady(this)) View.GONE else View.VISIBLE
                  if (hasPhotoAccess()) {
                      btnPhotos.visibility = View.GONE
                      grid.visibility = View.VISIBLE
                      loadPhotos()
                  } else {
                      btnPhotos.visibility = View.VISIBLE
                      grid.visibility = View.GONE
                  }
              }

              private fun photoPermissions(): Array<String> = when {
                  Build.VERSION.SDK_INT >= 34 -> arrayOf(
                      Manifest.permission.READ_MEDIA_IMAGES,
                      Manifest.permission.READ_MEDIA_VISUAL_USER_SELECTED
                  )
                  Build.VERSION.SDK_INT >= 33 -> arrayOf(Manifest.permission.READ_MEDIA_IMAGES)
                  else -> arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE)
              }

              private fun hasPhotoAccess(): Boolean = photoPermissions().any {
                  ContextCompat.checkSelfPermission(this, it) == PackageManager.PERMISSION_GRANTED
              }

              private fun loadPhotos() {
                  io.execute {
                      val found = ArrayList<Long>()
                      try {
                          contentResolver.query(
                              MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                              arrayOf(MediaStore.Images.Media._ID),
                              null, null,
                              "${MediaStore.Images.Media.DATE_ADDED} DESC"
                          )?.use { c ->
                              val col = c.getColumnIndexOrThrow(MediaStore.Images.Media._ID)
                              while (c.moveToNext()) found.add(c.getLong(col))
                          }
                      } catch (_: Exception) {
                      }
                      runOnUiThread {
                          ids.clear()
                          ids.addAll(found)
                          GalleryHolder.ids = found.toLongArray()
                          adapter.notifyDataSetChanged()
                      }
                  }
              }

              private class Holder(val image: ImageView) : RecyclerView.ViewHolder(image)

              private val adapter = object : RecyclerView.Adapter<Holder>() {
                  override fun getItemCount() = ids.size

                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): Holder {
                      val view = SquareImageView(parent.context).apply {
                          scaleType = ImageView.ScaleType.CENTER_CROP
                          setPadding(2, 2, 2, 2)
                          setBackgroundColor(0xFF0E1020.toInt())
                      }
                      return Holder(view)
                  }

                  override fun onBindViewHolder(holder: Holder, position: Int) {
                      val id = ids[position]
                      holder.image.tag = id
                      holder.image.setOnClickListener {
                          GalleryHolder.ids = ids.toLongArray()
                          startActivity(
                              Intent(this@MainActivity, SendActivity::class.java)
                                  .putExtra(SendActivity.EXTRA_GALLERY_INDEX, holder.bindingAdapterPosition)
                          )
                      }
                      val cached = cache.get(id)
                      if (cached != null) {
                          holder.image.setImageBitmap(cached)
                          return
                      }
                      holder.image.setImageDrawable(null)
                      io.execute {
                          val bmp = try {
                              contentResolver.loadThumbnail(
                                  ContentUris.withAppendedId(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, id),
                                  Size(320, 320), null
                              )
                          } catch (_: Exception) {
                              null
                          }
                          if (bmp != null) {
                              cache.put(id, bmp)
                              runOnUiThread { if (holder.image.tag == id) holder.image.setImageBitmap(bmp) }
                          }
                      }
                  }
              }
          }

          /** Case carrée de la grille. */
          class SquareImageView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null
          ) : ImageView(context, attrs) {
              override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                  super.onMeasure(widthMeasureSpec, widthMeasureSpec)
              }
          }
          FLOWSHARE_EOF

      - name: "Fichier app/src/main/java/com/flowshare/app/MediaUtils.kt"
        run: |
          mkdir -p "FlowShare/app/src/main/java/com/flowshare/app"
          cat > "FlowShare/app/src/main/java/com/flowshare/app/MediaUtils.kt" <<'FLOWSHARE_EOF'
          package com.flowshare.app

          import android.content.ContentValues
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.ImageDecoder
          import android.net.Uri
          import android.os.Environment
          import android.os.ParcelFileDescriptor
          import android.provider.MediaStore
          import android.provider.OpenableColumns
          import java.io.FileInputStream
          import java.io.IOException

          object MediaUtils {

              data class Meta(val name: String, val mime: String, val size: Long)

              fun queryMeta(context: Context, uri: Uri): Meta {
                  var name = "photo_${System.currentTimeMillis()}.jpg"
                  var size = -1L
                  try {
                      context.contentResolver.query(
                          uri, arrayOf(OpenableColumns.DISPLAY_NAME, OpenableColumns.SIZE), null, null, null
                      )?.use { c ->
                          if (c.moveToFirst()) {
                              val ni = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                              if (ni >= 0 && !c.isNull(ni)) name = c.getString(ni)
                              val si = c.getColumnIndex(OpenableColumns.SIZE)
                              if (si >= 0 && !c.isNull(si)) size = c.getLong(si)
                          }
                      }
                  } catch (_: Exception) {
                  }
                  val mime = context.contentResolver.getType(uri) ?: "image/jpeg"
                  return Meta(name, mime, size)
              }

              /** Charge une image réduite pour l'affichage (évite de saturer la mémoire). */
              fun loadBitmap(context: Context, uri: Uri, maxDim: Int = 2048): Bitmap? = try {
                  val source = ImageDecoder.createSource(context.contentResolver, uri)
                  ImageDecoder.decodeBitmap(source) { decoder, info, _ ->
                      val w = info.size.width
                      val h = info.size.height
                      val scale = maxOf(w, h).toFloat() / maxDim
                      if (scale > 1f) {
                          decoder.setTargetSize(
                              (w / scale).toInt().coerceAtLeast(1),
                              (h / scale).toInt().coerceAtLeast(1)
                          )
                      }
                      decoder.allocator = ImageDecoder.ALLOCATOR_SOFTWARE
                  }
              } catch (_: Exception) {
                  null
              }

              /** Copie le fichier reçu dans Galerie › Pictures/FlowShare. */
              fun saveToGallery(context: Context, pfd: ParcelFileDescriptor, meta: Meta): Uri? {
                  val resolver = context.contentResolver
                  val mime = if (meta.mime.startsWith("image/")) meta.mime else "image/jpeg"
                  val values = ContentValues().apply {
                      put(MediaStore.Images.Media.DISPLAY_NAME, meta.name)
                      put(MediaStore.Images.Media.MIME_TYPE, mime)
                      put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/FlowShare")
                      put(MediaStore.Images.Media.IS_PENDING, 1)
                  }
                  val collection = MediaStore.Images.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                  val uri = resolver.insert(collection, values) ?: run { pfd.close(); return null }
                  return try {
                      FileInputStream(pfd.fileDescriptor).use { input ->
                          val out = resolver.openOutputStream(uri) ?: throw IOException("Pas de flux de sortie")
                          out.use { input.copyTo(it) }
                      }
                      values.clear()
                      values.put(MediaStore.Images.Media.IS_PENDING, 0)
                      resolver.update(uri, values, null, null)
                      uri
                  } catch (_: Exception) {
                      resolver.delete(uri, null, null)
                      null
                  } finally {
                      try { pfd.close() } catch (_: Exception) {}
                  }
              }
          }
          FLOWSHARE_EOF

      - name: "Fichier app/src/main/java/com/flowshare/app/NfcModes.kt"
        run: |
          mkdir -p "FlowShare/app/src/main/java/com/flowshare/app"
          cat > "FlowShare/app/src/main/java/com/flowshare/app/NfcModes.kt" <<'FLOWSHARE_EOF'
          package com.flowshare.app

          import android.app.Activity
          import android.content.ComponentName
          import android.nfc.NfcAdapter
          import android.nfc.cardemulation.CardEmulation
          import android.os.Build

          /**
           * Réglages NFC pendant que l'écran d'envoi est affiché :
           *  - notre service est prioritaire pour répondre,
           *  - (Android 15+) le téléphone qui envoie arrête de "lire" pour ne faire que "répondre",
           *    ce qui évite que les deux téléphones essaient de se lire en même temps.
           */
          object NfcModes {

              fun enterSendMode(activity: Activity) {
                  val adapter = NfcAdapter.getDefaultAdapter(activity) ?: return
                  try {
                      CardEmulation.getInstance(adapter).setPreferredService(
                          activity, ComponentName(activity, FlowHceService::class.java)
                      )
                  } catch (_: Throwable) {
                  }
                  if (Build.VERSION.SDK_INT >= 35) {
                      try {
                          val cls = NfcAdapter::class.java
                          val readerDisable = cls.getField("FLAG_READER_DISABLE").getInt(null)
                          val listenKeep = cls.getField("FLAG_LISTEN_KEEP").getInt(null)
                          cls.getMethod(
                              "setDiscoveryTechnology",
                              Activity::class.java,
                              Int::class.javaPrimitiveType,
                              Int::class.javaPrimitiveType
                          ).invoke(adapter, activity, readerDisable, listenKeep)
                      } catch (_: Throwable) {
                      }
                  }
              }

              fun exitSendMode(activity: Activity) {
                  val adapter = NfcAdapter.getDefaultAdapter(activity) ?: return
                  try {
                      CardEmulation.getInstance(adapter).unsetPreferredService(activity)
                  } catch (_: Throwable) {
                  }
                  if (Build.VERSION.SDK_INT >= 35) {
                      try {
                          NfcAdapter::class.java
                              .getMethod("resetDiscoveryTechnology", Activity::class.java)
                              .invoke(adapter, activity)
                      } catch (_: Throwable) {
                      }
                  }
              }
          }
          FLOWSHARE_EOF

